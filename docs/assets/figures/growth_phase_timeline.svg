<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">Circuit growth timeline</title>
  <desc id="desc">A growth timeline from dense candidate competition through QK pointer crystallization, AdamW preconditioning, write coupling, value-code readout, later heldout consolidation, and cross-seed role migration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#343434"/>
    </marker>
    <style>
      .title { font: 700 28px Georgia, serif; fill: #171615; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #4d4a44; }
      .axis { stroke: #343434; stroke-width: 2; marker-end: url(#arrow); }
      .tick { stroke: #6b655b; stroke-width: 1.4; }
      .tick-label { font: 600 12px Inter, Arial, sans-serif; fill: #443f38; }
      .phase-title { font: 700 15px Inter, Arial, sans-serif; fill: #171615; }
      .phase-text { font: 400 12.5px Inter, Arial, sans-serif; fill: #37342f; }
      .phase-math { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #263034; }
      .box { fill: #fffdf8; stroke: #bcb2a2; stroke-width: 1.4; rx: 8; }
      .green { fill: #e4f2ea; stroke: #57816a; }
      .blue { fill: #e7eef4; stroke: #5d778e; }
      .gold { fill: #fbefd7; stroke: #a47d35; }
      .rose { fill: #f6e5e1; stroke: #a06155; }
      .ink { fill: #ebe9f0; stroke: #6e6a82; }
      .callout { fill: #ffffff; stroke: #d7d0c2; stroke-width: 1.2; rx: 8; }
      .connector { stroke: #8a8173; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="1180" height="540" fill="#f8f5ef"/>
  <text x="42" y="52" class="title">The circuit grows in overlapping stages</text>
  <text x="42" y="82" class="subtitle">Competition -> scaffold -> pointer crystallization -> write coupling -> value-code readout -> later consolidation.</text>

  <line x1="74" y1="128" x2="1104" y2="128" class="axis"/>
  <g>
    <line x1="74" y1="116" x2="74" y2="140" class="tick"/>
    <text x="74" y="160" class="tick-label" text-anchor="middle">0</text>
    <line x1="220" y1="116" x2="220" y2="140" class="tick"/>
    <text x="220" y="160" class="tick-label" text-anchor="middle">750</text>
    <line x1="366" y1="116" x2="366" y2="140" class="tick"/>
    <text x="366" y="160" class="tick-label" text-anchor="middle">1500</text>
    <line x1="415" y1="116" x2="415" y2="140" class="tick"/>
    <text x="415" y="160" class="tick-label" text-anchor="middle">1750</text>
    <line x1="562" y1="116" x2="562" y2="140" class="tick"/>
    <text x="562" y="160" class="tick-label" text-anchor="middle">2500</text>
    <line x1="758" y1="116" x2="758" y2="140" class="tick"/>
    <text x="758" y="160" class="tick-label" text-anchor="middle">3500</text>
    <line x1="1104" y1="116" x2="1104" y2="140" class="tick"/>
    <text x="1104" y="160" class="tick-label" text-anchor="middle">6000</text>
  </g>

  <g transform="translate(42 194)">
    <rect x="0" y="0" width="196" height="122" class="box rose"/>
    <text x="16" y="28" class="phase-title">Dense competition</text>
    <text x="16" y="52" class="phase-text">Feature and neuron stories</text>
    <text x="16" y="70" class="phase-text">are shared, opposed, and</text>
    <text x="16" y="88" class="phase-text">sign-conflicted.</text>
    <text x="16" y="110" class="phase-math">family7 beats family4</text>
  </g>

  <path d="M 190 194 C 190 164 220 164 220 134" class="connector"/>

  <g transform="translate(266 194)">
    <rect x="0" y="0" width="190" height="122" class="box gold"/>
    <text x="16" y="28" class="phase-title">Early scaffold</text>
    <text x="16" y="52" class="phase-text">The QK direction is not</text>
    <text x="16" y="70" class="phase-text">mature, but it rotates</text>
    <text x="16" y="88" class="phase-text">toward the final route.</text>
    <text x="16" y="110" class="phase-math">cos: .188 -> .588</text>
  </g>

  <path d="M 365 194 C 365 166 365 166 365 134" class="connector"/>

  <g transform="translate(482 194)">
    <rect x="0" y="0" width="230" height="122" class="box green"/>
    <text x="16" y="28" class="phase-title">Pointer crystallizes</text>
    <text x="16" y="52" class="phase-text">Support-value QK separation</text>
    <text x="16" y="70" class="phase-text">grows while rank concentrates.</text>
    <text x="16" y="92" class="phase-math">750->2500: actual +1.665</text>
    <text x="16" y="110" class="phase-math">raw SGD-eq -0.003</text>
  </g>

  <path d="M 562 194 C 562 164 562 164 562 134" class="connector"/>

  <g transform="translate(746 194)">
    <rect x="0" y="0" width="228" height="122" class="box blue"/>
    <text x="16" y="28" class="phase-title">AdamW pressure</text>
    <text x="16" y="52" class="phase-text">Actual optimizer state carries</text>
    <text x="16" y="70" class="phase-text">the route; beta1=0 still</text>
    <text x="16" y="88" class="phase-text">learns under the recipe.</text>
    <text x="16" y="110" class="phase-math">QK sep: 8.03 / 9.26</text>
  </g>

  <path d="M 860 194 C 860 164 758 164 758 134" class="connector"/>

  <g transform="translate(42 366)">
    <rect x="0" y="0" width="266" height="120" class="box ink"/>
    <text x="16" y="28" class="phase-title">Write coupling</text>
    <text x="16" y="52" class="phase-text">The direction is partly present early;</text>
    <text x="16" y="70" class="phase-text">readout coupling turns on sharply.</text>
    <text x="16" y="92" class="phase-math">1500->1750: +5.978</text>
    <text x="16" y="110" class="phase-math">residual 78%, L0MLP 22%</text>
  </g>

  <path d="M 174 366 C 174 330 390 330 390 134" class="connector"/>

  <g transform="translate(338 366)">
    <rect x="0" y="0" width="266" height="120" class="box green"/>
    <text x="16" y="28" class="phase-title">Broad value code</text>
    <text x="16" y="52" class="phase-text">Prediction residual becomes</text>
    <text x="16" y="70" class="phase-text">answer-value readable.</text>
    <text x="16" y="92" class="phase-math">1750 acc .608; 3500 .765</text>
    <text x="16" y="110" class="phase-math">rank127 keep ~= IID</text>
  </g>

  <path d="M 470 366 C 470 330 415 330 415 134" class="connector"/>

  <g transform="translate(634 366)">
    <rect x="0" y="0" width="248" height="120" class="box blue"/>
    <text x="16" y="28" class="phase-title">Role migration</text>
    <text x="16" y="52" class="phase-text">The function repeats across</text>
    <text x="16" y="70" class="phase-text">seeds while the head/path</text>
    <text x="16" y="88" class="phase-text">address changes.</text>
    <text x="16" y="110" class="phase-math">same role, moving room</text>
  </g>

  <path d="M 760 366 C 760 330 758 330 758 134" class="connector"/>

  <g transform="translate(916 366)">
    <rect x="0" y="0" width="222" height="120" class="box callout"/>
    <text x="16" y="28" class="phase-title">Later 16k windows</text>
    <text x="16" y="52" class="phase-text">4250->4750: heldout</text>
    <text x="16" y="70" class="phase-text">consolidation.</text>
    <text x="16" y="88" class="phase-text">7500->8000: upper-layer</text>
    <text x="16" y="106" class="phase-text">reorganization.</text>
  </g>
</svg>
