<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#343434" />
</marker>
<style>
.title{font:700 22px Georgia,serif;fill:#171615}.subtitle{font:15px Georgia,serif;fill:#4a4741}.label{font:14px Georgia,serif;fill:#2a2927}.small{font:12px Georgia,serif;fill:#5a5247}.tiny{font:10.5px Georgia,serif;fill:#5a5247}.axis{stroke:#4a4741;stroke-width:1}.grid{stroke:#ddd6c8;stroke-width:1}.box{fill:#fffdf8;stroke:#9b8f7e;stroke-width:1.4;rx:8}.ok{fill:#e7f3ed;stroke:#4f8f6f}.warn{fill:#fff4dc;stroke:#b78b3b}.open{fill:#f8e8e6;stroke:#aa615b}</style>
</defs>
<text x="32.0" y="36.0" class="title" text-anchor="start">Write side: the useful object is a residual coupling</text>
<text x="32.0" y="61.0" class="subtitle" text-anchor="start">QK chooses a source. The write side asks whether the resulting residual change is readable by downstream answer directions.</text>
<rect x="38.0" y="126.0" width="150.0" height="86.0" class="box" />
<text x="113.0" y="160.0" class="label" text-anchor="middle">L0H0 source</text>
<text x="113.0" y="184.0" class="tiny" text-anchor="middle">attends to value-bearing state</text>
<line x1="198.0" y1="169.0" x2="230.0" y2="169.0" stroke="#343434" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240.0" y="126.0" width="185.0" height="86.0" class="box" />
<text x="332.5" y="160.0" class="label" text-anchor="middle">delta_write(x)</text>
<text x="332.5" y="184.0" class="tiny" text-anchor="middle">change at prediction position</text>
<line x1="435.0" y1="169.0" x2="467.0" y2="169.0" stroke="#343434" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="477.0" y="126.0" width="155.0" height="86.0" class="box" />
<text x="554.5" y="160.0" class="label" text-anchor="middle">L0MLP boundary</text>
<text x="554.5" y="184.0" class="tiny" text-anchor="middle">residual + nonlinear correction</text>
<line x1="642.0" y1="169.0" x2="674.0" y2="169.0" stroke="#343434" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="684.0" y="126.0" width="180.0" height="86.0" class="box" />
<text x="774.0" y="160.0" class="label" text-anchor="middle">g_ref(x)</text>
<text x="774.0" y="184.0" class="tiny" text-anchor="middle">mature answer-readout direction</text>
<rect x="156.0" y="270.0" width="668.0" height="70.0" class="warn" />
<text x="490.0" y="298.0" class="label" text-anchor="middle">C_write(theta) = E_x [ g_ref(x) . delta_write_theta(x) ]</text>
<text x="490.0" y="320.0" class="small" text-anchor="middle">This scalar asks whether the write is useful to the finished readout, not whether W_OV directly points at a token embedding.</text>
<text x="32.0" y="385.0" class="small" text-anchor="start">Interpretation: static W_OV was the wrong proof object. The measured write is contextual, position-specific, and read through later computation.</text>
</svg>
